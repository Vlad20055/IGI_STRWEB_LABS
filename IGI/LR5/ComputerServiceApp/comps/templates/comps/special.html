{% extends "comps/base.html" %}
{% block title %}Специально для вас{% endblock %}

{% block content %}
<h2>Специально для вас</h2>

<!-- Шутка дня -->
<h3>Шутка дня</h3>
<p><strong>{{ joke.setup }}</strong></p>
<p>{{ joke.punchline }}</p>
<form method="get">
    <button type="submit" name="action" value="joke">Ещё шутка</button>
</form>

<!-- Цитата дня -->
<h3>Цитата дня</h3>
<blockquote>
    <p>«{{ quote.body }}»</p>
    {% if quote.author %}
        <p>— {{ quote.author }}</p>
    {% endif %}
</blockquote>
<form method="get">
    <button type="submit" name="action" value="quote">Ещё цитата</button>
</form>
{% endblock %}
